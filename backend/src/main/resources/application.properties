# ──────────────────────────────────────────────────
#  SmartHR – Application Configuration
# ──────────────────────────────────────────────────

# Server (Supports dynamic cloud PORT assigned by Render/Railway)
server.port=${PORT:8080}

# ── H2 Database (Default: zero-config instant startup) ──
spring.datasource.url=jdbc:h2:mem:smarthr_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
app.jwt.secret=smarthr_super_secret_jwt_key_2024_do_not_share_in_production_use_env_var
app.jwt.expiration-ms=86400000

# ── Logging ──
logging.level.com.smarthr=INFO
logging.level.org.springframework.security=WARN

# ── Jackson ──
spring.jackson.serialization.fail-on-empty-beans=false
