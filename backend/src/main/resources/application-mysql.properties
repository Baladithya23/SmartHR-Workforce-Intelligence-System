# ──────────────────────────────────────────────────
#  SmartHR – MySQL Profile Configuration
#  Activate with: spring.profiles.active=mysql
# ──────────────────────────────────────────────────

spring.datasource.url=jdbc:mysql://localhost:3306/smarthr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
